version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: defi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-defi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-defipass}
      POSTGRES_DB: ${POSTGRES_DB:-defidb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defi -d defidb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (сессии, WebSocket pub/sub, кэш) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: defi_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: defi_backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app          # hot-reload в dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Hardhat node (локальный EVM) ────────────────────────────
  hardhat:
    build:
      context: ./contracts
      dockerfile: Dockerfile
    container_name: defi_hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    command: npx hardhat node --hostname 0.0.0.0

  # ─── Nginx (reverse proxy) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: defi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
